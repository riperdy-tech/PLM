name: plm

# Every published port binds to 127.0.0.1: the stack is for this machine only and
# its credentials are development placeholders. Containers reach each other by
# service name on the compose network, which these bindings do not affect.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plm
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Host port for alembic / psql runs from the dev venv (DATABASE_URL uses localhost).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d plm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # MinIO no longer publishes free images (the quay.io tag now answers "unauthorized").
    # Chainguard's maintained build is pinned by digest so CI is reproducible; to upgrade,
    # resolve the new digest of cgr.dev/chainguard/minio:latest and rerun the integration
    # tier. The hardened image has no curl, so the healthcheck uses the bundled `mc`.
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000 mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.29.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=plm
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      # auto-setup defaults to binding the container IP only; loopback then refuses
      # every in-container healthcheck. Bind all interfaces instead.
      - BIND_ON_IP=0.0.0.0
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      # `tctl` ships too but is past its end-of-support date; the Temporal CLI is
      # the supported probe. It exits 0 only while the frontend reports SERVING.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # W0.7: the dev worker serves ph1.market; P1.13 wires this phase's registrations
    # in so the deployed worker actually runs the market jobs (previously it served
    # the heartbeat only). Later waves add their queue and registrations (see
    # packages/plm_platform/README.md). The bind mount makes the repo the source of
    # truth, so code changes need no rebuild.
    command: ["python", "-m", "plm_platform.worker", "--task-queue", "ph1.market",
              "--load", "market_intelligence.jobs:REGISTRATIONS"]
    environment:
      # Compose services reach each other by service name; the localhost values in
      # .env are for tools on the host, and these explicit values win over .env.
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=postgresql://plm:${POSTGRES_PASSWORD}@postgres:5432/plm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-plm-media}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      # Real probe: exits non-zero unless the worker process is alive AND its
      # pollers are visible on the served task queue.
      test: ["CMD", "python", "-m", "plm_platform.worker", "--healthcheck", "--task-queue", "ph1.market"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
