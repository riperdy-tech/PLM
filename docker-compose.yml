# The live stack is project `plm`, started from the main checkout only
# (C:\Users\riper\Downloads\PLM). A git worktree must set its own COMPOSE_PROJECT_NAME
# (e.g. plm_wt_<name>) before any `docker compose` command, or it would recreate the live
# containers with unmerged code. make.ps1, the Makefile and the Studio launcher refuse that;
# a worktree has no .env, so the required ${...:?} values below stop a bare compose too.
name: ${COMPOSE_PROJECT_NAME:-plm}

# Every published port binds to 127.0.0.1: the stack is for this machine only and
# its credentials are development placeholders. Containers reach each other by
# service name on the compose network, which these bindings do not affect.

x-plm-app: &plm-app
  build:
    context: .
    dockerfile: Dockerfile.dev
  # Restart after a crash or a Docker Desktop restart; give a render or upload time to stop.
  restart: unless-stopped
  stop_grace_period: 120s
  environment:
    # Compose services reach each other by service name; these win over .env.
    - TEMPORAL_HOST=temporal:7233
    - DATABASE_URL=postgresql://plm:${POSTGRES_PASSWORD}@postgres:5432/${PLM_POSTGRES_DB:-plm}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ROOT_USER=${MINIO_ROOT_USER}
    - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    - MINIO_BUCKET=${MINIO_BUCKET:-plm-media}
    - PLM_SERVICE_TOKEN=${PLM_SERVICE_TOKEN:-}
    # P2 asks P1 for opportunities; inside the network that is the compose service.
    - PLM_SERVICE_URL__MARKET=http://api-market:8081
    # R5 development configuration (files in the bind-mounted repo; override on the host).
    # The ledger currency lets the pipeline read the run's write costs and the phases'
    # guards fund live writes; mock providers are simulated and never reserve.
    - PLM_BUDGET_LEDGER_CURRENCY=${PLM_BUDGET_LEDGER_CURRENCY:-USD}
    # Channel, release metadata, FX rates and the learning cycle for the pipeline worker.
    - PLM_PIPELINE_CONFIG_FILE=${PLM_PIPELINE_CONFIG_FILE:-/app/config/dev/pipeline.json}
    # Who may clear a pipeline hold ({"actor": ["role", ...]}); unset, nobody can.
    - PLM_PIPELINE_REVIEWERS_FILE=${PLM_PIPELINE_REVIEWERS_FILE:-}
    # Series -> YouTube playlist ({"series": {"playlist_id", "title"}}, ADR-0045); unset,
    # P7 attaches no playlist.
    - PLM_YOUTUBE_SERIES_PLAYLISTS_FILE=${PLM_YOUTUBE_SERIES_PLAYLISTS_FILE:-}
    # The deterministic mock outcome model behind P7's mock YouTube Analytics source and
    # P8's mock distributor statements (labelled mock; never a real audience).
    - PLM_MOCK_OUTCOMES_FILE=${PLM_MOCK_OUTCOMES_FILE:-/app/config/dev/mock_outcomes.json}
    # P6's render profile for an assemble request that names none (the pipeline names
    # none). The local stack renders previews (640x360, 15 fps): a 45-75 min playlist at
    # 1080p takes about 20 min per video on a dev machine. Production sets
    # yt_longform_1080p_v1 (P6's default when unset).
    - PLM_MEDIA_RENDER_PROFILE=${PLM_MEDIA_RENDER_PROFILE:-preview_360p_v1}
    # P6 waits for the owner's thumbnail art in this folder (relative to /app, the repo);
    # unset, P6 offers its own drawn thumbnails (services/media_factory/thumbnail_art).
    - PLM_THUMBNAIL_ART_INBOX=${PLM_THUMBNAIL_ART_INBOX:-}
    # P6 copies a published video's renders here and frees them locally (the api-media
    # /archive mount below); unset, nothing is archived.
    - PLM_ARCHIVE_DIR=${PLM_ARCHIVE_DIR:-}
    # Provider modes, execution policies, the owner's grants and the manual-song inboxes,
    # passed explicitly so `docker compose config` shows what the containers run with
    # (each service also logs its effective modes and policies at boot). Unset here, the
    # code still reads the bind-mounted .env, then its safe default (mock, dry_run, none).
    # A new PLM_PROVIDER_MODE__* / PLM_EXECUTION_POLICY__* key belongs in this list.
    - PLM_PROVIDER_MODE__YOUTUBE=${PLM_PROVIDER_MODE__YOUTUBE:-}
    - PLM_PROVIDER_MODE__MUSIC=${PLM_PROVIDER_MODE__MUSIC:-}
    - PLM_EXECUTION_POLICY__YOUTUBE_UPLOAD=${PLM_EXECUTION_POLICY__YOUTUBE_UPLOAD:-}
    - PLM_EXECUTION_POLICY__YOUTUBE_THUMBNAIL=${PLM_EXECUTION_POLICY__YOUTUBE_THUMBNAIL:-}
    - PLM_EXECUTION_POLICY__YOUTUBE_PLAYLIST=${PLM_EXECUTION_POLICY__YOUTUBE_PLAYLIST:-}
    - PLM_EXECUTION_POLICY__MUSIC_IMPORT=${PLM_EXECUTION_POLICY__MUSIC_IMPORT:-}
    - PLM_WRITE_AUTHORIZATIONS_FILE=${PLM_WRITE_AUTHORIZATIONS_FILE:-}
    - PLM_FLOW_MUSIC_MANUAL_INBOX=${PLM_FLOW_MUSIC_MANUAL_INBOX:-}
    - PLM_FLOW_MUSIC_PLAN_TIER=${PLM_FLOW_MUSIC_PLAN_TIER:-}
    - PLM_FLOW_MUSIC_ACCOUNT_REF=${PLM_FLOW_MUSIC_ACCOUNT_REF:-}
    - PLM_FLOW_MUSIC_MODEL_VERSION=${PLM_FLOW_MUSIC_MODEL_VERSION:-}
    - PLM_SUNO_MANUAL_INBOX=${PLM_SUNO_MANUAL_INBOX:-}
    - PLM_SUNO_PLAN_TIER=${PLM_SUNO_PLAN_TIER:-}
    - PLM_SUNO_ACCOUNT_REF=${PLM_SUNO_ACCOUNT_REF:-}
    - PLM_SUNO_MODEL_VERSION=${PLM_SUNO_MODEL_VERSION:-}
    - PLM_EXPERIMENTS_MANUAL_SUPPLY=${PLM_EXPERIMENTS_MANUAL_SUPPLY:-}
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    temporal:
      condition: service_healthy

services:
  postgres:
    # Pinned by digest (tag kept for readability and the migration rollout's image check).
    # To upgrade: docker pull postgres:16, then take the new RepoDigest.
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      # PLM_POSTGRES_DB / PLM_POSTGRES_HOST_PORT default to the development values; CI sets
      # a disposable name and port (see .github/workflows/ci.yml and migration_safety.py).
      POSTGRES_DB: ${PLM_POSTGRES_DB:-plm}
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (a git worktree has none - set COMPOSE_PROJECT_NAME, see the top of this file)}
    # Host port for alembic / psql runs from the dev venv (DATABASE_URL uses localhost).
    ports:
      - "127.0.0.1:${PLM_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d ${PLM_POSTGRES_DB:-plm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-volume-owner:
    # One-shot: Chainguard's MinIO runs as uid 65532, but volumes created by the earlier
    # root-run image are owned by root and MinIO cannot write them. Same pinned image,
    # run once as root, so upgraded dev machines and fresh CI volumes behave the same.
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - miniodata:/data
    restart: "no"

  minio:
    # MinIO no longer publishes free images (the quay.io tag now answers "unauthorized").
    # Chainguard's maintained build is pinned by digest so CI is reproducible; to upgrade,
    # resolve the new digest of cgr.dev/chainguard/minio:latest and rerun the integration
    # tier. The hardened image has no curl, so the healthcheck uses the bundled `mc`.
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    depends_on:
      minio-volume-owner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000 mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.29.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=plm
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      # auto-setup defaults to binding the container IP only; loopback then refuses
      # every in-container healthcheck. Bind all interfaces instead.
      - BIND_ON_IP=0.0.0.0
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      # `tctl` ships too but is past its end-of-support date; the Temporal CLI is
      # the supported probe. It exits 0 only while the frontend reports SERVING.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # W0.7: the dev worker serves ph1.market; P1.13 wires this phase's registrations
    # in so the deployed worker actually runs the market jobs (previously it served
    # the heartbeat only). Later waves add their queue and registrations (see
    # packages/plm_platform/README.md). The bind mount makes the repo the source of
    # truth, so code changes need no rebuild.
    command: ["python", "-m", "plm_platform.worker", "--task-queue", "ph1.market",
              "--load", "market_intelligence.jobs:REGISTRATIONS"]
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      # Compose services reach each other by service name; the localhost values in
      # .env are for tools on the host, and these explicit values win over .env.
      - TEMPORAL_HOST=temporal:7233
      - DATABASE_URL=postgresql://plm:${POSTGRES_PASSWORD}@postgres:5432/${PLM_POSTGRES_DB:-plm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-plm-media}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      # Real probe: exits non-zero unless the worker process is alive AND its
      # pollers are visible on the served task queue.
      test: ["CMD", "python", "-m", "plm_platform.worker", "--healthcheck", "--task-queue", "ph1.market"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # R3-R5: the PART XIV pipeline workflow (one run per P2 directive) on the `pipeline`
  # task queue. Every step calls the phase APIs over HTTP (base URLs default to the api-*
  # service names; override with PLM_SERVICE_URL__<PHASE>) with PLM_SERVICE_TOKEN. The
  # pipeline reserves no budget: each phase's write guard is the one reservation, and a
  # guard refusal holds the run. The run's costs are read from the ledger named by
  # PLM_BUDGET_LEDGER_CURRENCY; channel, release metadata, FX rates and the learning
  # cycle come from PLM_PIPELINE_CONFIG_FILE (a missing section makes its step refuse).
  # Reviewers come from PLM_PIPELINE_REVIEWERS_FILE (unset: nobody can resume a
  # reviewable hold).
  pipeline-worker:
    <<: *plm-app
    command: ["python", "-m", "plm_platform.worker", "--task-queue", "pipeline",
              "--load", "plm_platform.pipeline.worker:REGISTRATIONS"]
    healthcheck:
      # Real probe: the process is alive AND its pollers are visible on `pipeline`.
      test: ["CMD", "python", "-m", "plm_platform.worker", "--healthcheck", "--task-queue", "pipeline"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # R3 runtime: one API container per phase, same dev image and environment as the
  # worker. Each mounts plm_platform.health, so readiness means the phase can reach its
  # database. Mutating routes stay fail-closed until PLM_SERVICE_TOKEN is set.
  api-market:
    <<: *plm-app
    command: ["plm", "market", "serve", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-ar:
    <<: *plm-app
    command: ["plm", "ar", "serve", "--host", "0.0.0.0", "--port", "8082"]
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-experiments:
    <<: *plm-app
    command: ["plm", "experiments", "serve", "--host", "0.0.0.0", "--port", "8083"]
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-music:
    <<: *plm-app
    command: ["plm", "music", "serve", "--host", "0.0.0.0", "--port", "8004"]
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-qa:
    <<: *plm-app
    command: ["plm", "qa", "serve", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "127.0.0.1:8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-media:
    <<: *plm-app
    command: ["plm", "media", "serve", "--host", "0.0.0.0", "--port", "8006"]
    # FFmpeg renders run here; a cap keeps a runaway render from starving Postgres and
    # Temporal in the Docker VM (about 7.7 GiB on the owner's machine).
    mem_limit: 5g
    volumes:
      - .:/app
      # The backup drive (PLM_ARCHIVE_HOST_DIR, e.g. E:/PLM-backups); P6 archives only when
      # it holds the .plm-archive marker, so an unplugged drive archives nothing.
      - ${PLM_ARCHIVE_HOST_DIR:-./data/archive-unset}:/archive
    ports:
      - "127.0.0.1:8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-youtube:
    <<: *plm-app
    command: ["plm", "youtube", "serve", "--host", "0.0.0.0", "--port", "8007"]
    ports:
      - "127.0.0.1:8007:8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-distribution:
    <<: *plm-app
    command: ["plm", "distribution", "serve", "--host", "0.0.0.0", "--port", "8008"]
    ports:
      - "127.0.0.1:8008:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-analytics:
    <<: *plm-app
    command: ["plm", "analytics", "serve", "--host", "0.0.0.0", "--port", "8009"]
    ports:
      - "127.0.0.1:8009:8009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  miniodata:
