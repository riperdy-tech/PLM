# PR CI for the PLM monorepo (W0.11).
#
# The integration tests run against the repository's own docker-compose.yml —
# deliberately *not* a parallel GitHub `services:` block. Ruling (W0.11, SDD
# ledger): CI builds its service containers from the same compose file as
# local development, because a second service definition is exactly the
# local/CI drift this program exists to prevent. When CI needs a different
# resource profile, add an override file — never fork the service list.
#
# Step shape: lint, types, then the fast suite (every non-integration test —
# unit, contract, smoke), then the compose stack with a health-waited start,
# then the integration suite (its migration round-trip is the migration
# check), then teardown that runs even when the tests failed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, types, unit, contract, integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The pip download directory is cached on pyproject.toml: a dependency
      # change invalidates it, everything else restores from the last run.
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install project (editable, dev extras)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy packages services

      # Hermetic: no services, no .env (the unit tests inject their settings).
      - name: Unit and contract tests
        run: pytest -q -m "not integration"

      # Compose reads .env for POSTGRES_PASSWORD, MINIO_* and friends; the
      # committed example documents the canonical local values.
      - name: Provide .env for compose and tests
        run: |
          cp .env.example .env
          # A disposable database (plm_platform.migration_safety): the code-only
          # migration hold and the R5 guard exempt only reserved names on a loopback,
          # non-5432 port. The shared development DB plm on 5432 stays held.
          sed -i 's#@127.0.0.1:5432/plm$#@127.0.0.1:55432/plm_migration_disposable_ci#' .env
          grep -qx 'DATABASE_URL=postgresql://plm:.*@127.0.0.1:55432/plm_migration_disposable_ci' .env
          echo 'PLM_POSTGRES_DB=plm_migration_disposable_ci' >> .env
          echo 'PLM_POSTGRES_HOST_PORT=55432' >> .env

      - name: Start the compose stack and wait for health
        run: docker compose up -d --wait --wait-timeout 420

      # The integration tier assumes a migrated database (`plm migrate`, as the README
      # documents); without this step it ran against empty schemas.
      - name: Apply migrations
        run: plm migrate

      - name: Integration tests
        run: pytest -q -m integration

      # Media tests need the pinned FFmpeg 7 in the dev image, so they run inside it; a
      # missing tool fails instead of skipping.
      - name: Media tests (dev image)
        run: docker compose run --rm --no-deps -e PLM_REQUIRE_MEDIA_TOOLS=1 worker pytest -q -m media

      - name: Tear down the compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  # Gate R5: the full chain from a P1 observation to LEARNING on the compose stack, with
  # Temporal's time-skipping test server for the 28-day horizon. Production content
  # scale (45-75 min playlists, about 170 P5 evaluations, previews rendered by FFmpeg)
  # takes about 40 min, so it has its own job; `-m integration` skips it.
  full-chain:
    name: Gate R5 full chain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install project (editable, dev extras)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Provide .env for compose and tests
        run: |
          cp .env.example .env
          # A disposable database (plm_platform.migration_safety): the code-only
          # migration hold and the R5 guard exempt only reserved names on a loopback,
          # non-5432 port. The shared development DB plm on 5432 stays held.
          sed -i 's#@127.0.0.1:5432/plm$#@127.0.0.1:55432/plm_r5_ci#' .env
          grep -qx 'DATABASE_URL=postgresql://plm:.*@127.0.0.1:55432/plm_r5_ci' .env
          echo 'PLM_POSTGRES_DB=plm_r5_ci' >> .env
          echo 'PLM_POSTGRES_HOST_PORT=55432' >> .env

      - name: Start the compose stack and wait for health
        run: docker compose up -d --wait --wait-timeout 420

      - name: Apply migrations
        run: plm migrate

      # The explicit opt-in: without it the destructive R5 suite skips (a skip is not a
      # pass). Its guard still requires the disposable plm_r5_ci target above.
      - name: Full chain (Gate R5)
        env:
          PLM_R5_ISOLATED_STACK: "1"
        run: pytest -q -m full_chain

      - name: Tear down the compose stack
        if: always()
        run: docker compose down -v --remove-orphans
