[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plm"
version = "0.1.0"
description = "PLM monorepo: autonomous music-label platform (Wave 0 scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "temporalio>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["packages", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
markers = [
    "integration: needs docker compose services (postgres, minio); skips cleanly when unreachable",
]
