[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plm"
version = "0.1.0"
description = "PLM monorepo: autonomous music-label platform (Wave 0 scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "minio>=7.2",
    "numpy>=2.0",
    "Pillow>=11.0",
    "pyloudnorm>=0.1",
    "soundfile>=0.12",
    "prometheus-client>=0.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "temporalio>=1.33",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
plm = "plm_platform.cli:main"

[project.optional-dependencies]
dev = [
    "freezegun>=1.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
    "ruff==0.17.0",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["packages", "services"]

[tool.setuptools.package-data]
# Versioned policy data read at runtime through importlib.resources (R3 hold classes).
plm_platform = ["policy/*.json"]
# P5 audio-QA policy and rights-detector thresholds (R4, ADR-0034).
quality_gate = ["audio/*.json", "detectors/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The seam template is copied, never imported or collected: the underscore is
# deliberate (keeps it out of a default pytest run), so the module-name rule
# does not apply.
"tests/contract/_TEMPLATE_test_seam.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
# Review fix 3: the gate must cover service code too — `files = ["packages"]` left
# every services/ error unreported, so the report was vacuous for those tasks. Both
# trees are checked with top-level module names (`plm_contracts`, `plm_platform`,
# `market_intelligence`), which is how the editable install exposes them.
files = ["packages", "services"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/packages", "$MYPY_CONFIG_FILE_DIR/services"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
# A hung test fails instead of stalling the run (R0 baseline: the full suite once
# blocked for >15 min on unreachable compose services).
timeout = 120
markers = [
    "integration: needs docker compose services (postgres, minio); skips cleanly when unreachable",
    "full_chain: the Gate R5 full chain on the compose stack (also integration); runs only when selected with -m full_chain (about 40 min)",
    "media: needs ffmpeg/ffprobe (the dev image pins FFmpeg 7); skipped on a host without them unless PLM_REQUIRE_MEDIA_TOOLS=1, which turns a missing tool into a failure",
]
