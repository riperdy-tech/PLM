# Alembic configuration for the single PLM migration chain (W0.5).
#
# The connection string is deliberately absent: migrations/env.py builds it from
# plm_platform.config (process environment first, then .env at the repo root).
# Never add credentials to this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
version_locations = %(here)s/migrations/versions
# One directory per schema lives under migrations/versions/ (P0 §4); recursing
# means a phase only ever creates and writes its own directory, and this file
# never needs editing when a new phase's first revision lands.
recursive_version_locations = true

# Logging configuration is consumed by migrations/env.py (standard alembic setup).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
